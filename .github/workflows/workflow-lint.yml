# actionlint and zizmor over this repository's workflows.
name: Workflow lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: lightwebinc/ci/.github/workflows/workflow-lint.yml@addd14064ef61ebf08d01de9b80bda61438880fb # v0.7.1

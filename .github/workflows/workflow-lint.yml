# actionlint and zizmor over this repository's workflows.
name: Workflow lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: lightwebinc/ci/.github/workflows/workflow-lint.yml@5e3a118fc997d254cbc49b9bf14c4fd3ec3974d0 # v0.7.2
